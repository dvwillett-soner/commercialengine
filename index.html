          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const rawJson = window.XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            if (!rawJson || rawJson.length === 0) {
              throw new Error('Spreadsheet contains no readable rows.');
            }

            const parsedItems = rawJson.map((row, idx) => {
              const keys = Object.keys(row);
              const findVal = (keywords) => {
                const key = keys.find(k => keywords.some(kw => k.toLowerCase().trim().includes(kw)));
                return key ? row[key] : null;
              };

              const itemTitle = findVal(['item', 'service', 'deliverable', 'title', 'task', 'name']) || ('Service #' + (idx + 1));

      // True AI Reasoning Scope Generator using Gemini 3 Flash Preview with Structured JSON

      const updateUnitHours = (id, delta) => {

                            onClick: () => deleteRecord(rec.id),
                            className: 'text-zinc-600 hover:text-rose-400 p-1.5 rounded'
                          }, h(Icon, { name: 'trash', className: 'w-3 h-3' }))
                        )
                      )
                    );
                  })
                )
              )
            ),

            h('div', { className: 'p-4 border-t border-zinc-850 bg-zinc-950/70 flex items-center justify-between text-xs' },
              h('div', { className: 'text-zinc-400' },
                'Showing ', h('strong', { className: 'text-white' }, filteredRecords.length), ' of ', h('strong', { className: 'text-white' }, commercialRecords.length), ' records.'
              ),
              h('div', { className: 'flex items-center gap-4 font-mono' },
                h('div', null,
                  h('span', { className: 'text-zinc-500 mr-1' }, 'Visible Sum:'),
                  h('strong', { className: 'text-amber-400 font-bold' },
                    CURRENCY_SYMBOL + Math.round(filteredRecords.reduce((acc, curr) => acc + (Number(curr.grandTotal) || 0), 0)).toLocaleString()
                  )
                ),
                h('button', {
                  onClick: () => setActiveTab('studio'),
                  className: 'bg-zinc-100 hover:bg-white text-zinc-950 font-bold px-3 py-1.5 rounded text-xs'
                }, 'New Commercial \u2192')
              )
            )
          )
        ),

        // Drawer
        isRateDrawerOpen ? h('div', { className: 'fixed inset-0 z-50 flex justify-end' },
          h('div', { onClick: () => setIsRateDrawerOpen(false), className: 'fixed inset-0 bg-black/70 backdrop-blur-sm' }),
          h('div', { className: 'relative w-full max-w-2xl bg-zinc-950 border-l border-zinc-800 p-6 shadow-2xl flex flex-col justify-between z-10 overflow-hidden' },
            h('div', { className: 'flex flex-col h-full overflow-hidden' },
              h('div', { className: 'flex items-center justify-between pb-3 border-b border-zinc-850' },
                h('div', null,
                  h('h3', { className: 'font-bold text-base text-white flex items-center gap-2' },
                    h(Icon, { name: 'sliders', className: 'w-4 h-4 text-amber-400' }), 'Agency Rate Card Catalog'
                  ),
                  h('p', { className: 'text-xs text-zinc-400 mt-0.5' }, 'UAE Agency Services, Baseline Hours, Rates & 10% PM fee')
                ),
                h('button', { onClick: () => setIsRateDrawerOpen(false), className: 'text-zinc-400 hover:text-white p-1' }, h(Icon, { name: 'x', className: 'w-4 h-4' }))
              ),

              h('div', { className: 'mt-3 p-3 bg-zinc-900 border border-zinc-850 rounded-lg flex items-center justify-between gap-2.5' },
                h('div', { className: 'flex items-center gap-2' },
                  h('button', {
                    onClick: () => fileInputRef.current && fileInputRef.current.click(),
                    className: 'text-xs bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-3 py-1.5 rounded flex items-center gap-1.5'
                  }, h(Icon, { name: 'upload', className: 'w-3.5 h-3.5' }), 'Upload New Card'),
                  h('button', {
                    onClick: downloadRateCardTemplate,
                    className: 'text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1.5 rounded border border-zinc-700 flex items-center gap-1'
                  }, h(Icon, { name: 'download', className: 'w-3 h-3 text-zinc-400' }), 'Get Template')
                ),
                h('button', {
                  onClick: resetToOfficialRateCard,
                  className: 'text-xs text-zinc-400 hover:text-white flex items-center gap-1'
                }, h(Icon, { name: 'refresh', className: 'w-3 h-3' }), 'Reset')
              ),

              h('div', { className: 'mt-3 p-3 bg-zinc-900/60 border border-zinc-800 rounded-lg flex items-center justify-between' },
                h('div', null,
                  h('span', { className: 'text-xs font-semibold text-zinc-200' }, rateCard.length + ' Services in Catalog'),
                  h('span', { className: 'text-[11px] text-zinc-400 block' }, 'Currency: United Arab Emirates Dirham (AED)')
                ),
                h('div', { className: 'text-right' },
                  h('span', { className: 'text-[10px] text-zinc-500 uppercase font-semibold block' }, 'Catalog Median'),
                  h('span', { className: 'text-base font-bold font-mono text-amber-400' }, CURRENCY_SYMBOL + rateCardMedian + '/hr')
                )
              ),

              h('div', { className: 'mt-3 grid grid-cols-1 sm:grid-cols-12 gap-2' },
                h('div', { className: 'sm:col-span-7 relative' },
                  h('div', { className: 'absolute left-2.5 top-2.5 text-zinc-500' }, h(Icon, { name: 'search', className: 'w-3.5 h-3.5' })),
                  h('input', {
                    type: 'text',
                    placeholder: 'Search service...',
                    value: drawerSearch,
                    onChange: (e) => setDrawerSearch(e.target.value),
                    className: 'w-full bg-zinc-900 border border-zinc-800 rounded pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none'
                  })
                ),
                h('div', { className: 'sm:col-span-5' },
                  h('select', {
                    value: selectedCategory,
                    onChange: (e) => setSelectedCategory(e.target.value),
                    className: 'w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-xs text-zinc-300'
                  }, categories.map(c => h('option', { key: c, value: c }, c)))
                )
              ),

              h('div', { className: 'mt-3 flex-1 overflow-y-auto space-y-2 pr-1' },
                filteredRateCard.map(item => {
                  const base = item.hours * item.hourlyRate;
                  const pm = Math.round(base * 0.10);
                  const total = base + pm;

                  return h('div', { key: item.id, className: 'p-3 bg-zinc-900/60 hover:bg-zinc-900 border border-zinc-850 rounded-lg flex flex-col gap-2' },
                    h('div', { className: 'flex items-start justify-between gap-3' },
                      h('div', null,
                        h('div', { className: 'flex items-center gap-2' },
                          h('span', { className: 'font-semibold text-xs text-white' }, item.item),
                          h('span', {
                            className: 'text-[10px] px-1.5 py-0.2 rounded font-mono ' +
                              (item.seniority === 'Senior' ? 'bg-purple-950 text-purple-300' :
                               item.seniority === 'Mid' ? 'bg-blue-950 text-blue-300' :
                               'bg-emerald-950 text-emerald-300')
                          }, item.seniority)
                        ),
                        h('span', { className: 'text-[10px] text-zinc-500 block mt-0.5' }, item.category)
                      ),
                      h('button', {
                        onClick: () => {
                          addLineItemFromRateCard(item);
                          setIsRateDrawerOpen(false);
                        },
                        className: 'text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-2 py-1 rounded flex items-center gap-1 shrink-0'
                      }, h(Icon, { name: 'plus', className: 'w-3 h-3' }), 'Insert')
                    ),
                    h('p', { className: 'text-[11px] text-zinc-400 line-clamp-2' }, item.description),
                    h('div', { className: 'flex items-center justify-between pt-2 border-t border-zinc-850/80 text-[11px] font-mono' },
                      h('span', { className: 'text-zinc-400' }, item.hours + ' hrs @ ' + CURRENCY_SYMBOL + item.hourlyRate + '/hr'),
                      h('span', { className: 'font-bold text-amber-400' }, CURRENCY_SYMBOL + total.toLocaleString())
                    )
                  );
                })
              ),

              h('div', { className: 'pt-3 border-t border-zinc-850 mt-2' },
                h('button', {
                  onClick: () => setIsRateDrawerOpen(false),
                  className: 'w-full py-2 bg-zinc-100 hover:bg-white text-zinc-950 rounded text-xs font-semibold'
                }, 'Done')
              )
            )
          )
        ) : null,

        // AI Settings Modal
        isAiConfigOpen ? h('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4' },
          h('div', { onClick: () => setIsAiConfigOpen(false), className: 'fixed inset-0 bg-black/75 backdrop-blur-sm' }),
          h('div', { className: 'relative w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl z-10 space-y-4' },
            h('div', { className: 'flex items-center justify-between pb-3 border-b border-zinc-800' },
              h('div', { className: 'flex items-center gap-2' },
                h('div', { className: 'h-8 w-8 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center' },
                  h(Icon, { name: 'sparkles', className: 'w-4 h-4' })
                ),
                h('div', null,
                  h('h3', { className: 'text-sm font-bold text-white' }, 'AI Scoping Reasoning Engine'),
                  h('p', { className: 'text-[11px] text-zinc-400' }, 'Powered by Google Gemini 3 Flash')
                )
              ),
              h('button', { onClick: () => setIsAiConfigOpen(false), className: 'text-zinc-400 hover:text-white p-1' },
                h(Icon, { name: 'x', className: 'w-4 h-4' })
              )
            ),

            h('div', { className: 'space-y-3' },
              h('p', { className: 'text-xs text-zinc-300 leading-relaxed' },
                'ScopeCraft performs deep commercial reasoning (evaluating timeline intensity, executive visibility, reputation risk, and implied deliverables) rather than simplistic keyword extraction.'
              ),
              h('div', null,
                h('label', { className: 'text-[11px] font-medium text-zinc-400 block mb-1' }, 'Gemini API Key (Optional / Direct)'),
                h('input', {
                  type: 'password',
                  value: geminiApiKey,
                  onChange: (e) => saveApiKey(e.target.value),
                  placeholder: 'AIzaSy...',
                  className: 'w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-amber-500'
                }),
                h('span', { className: 'text-[10px] text-zinc-500 block mt-1' },
                  'Leave empty for environment key, or enter your personal Gemini API key. Stored only in your browser.'
                )
              )
            ),

            h('div', { className: 'pt-3 flex items-center justify-end gap-2' },
              h('button', {
                onClick: () => setIsAiConfigOpen(false),
                className: 'px-4 py-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold rounded-lg text-xs transition'
              }, 'Save & Close')
            )
          )
        ) : null,

        // Footer
        h('footer', { className: 'border-t border-zinc-900 py-3 text-center text-[11px] text-zinc-500' },
          'ScopeCraft Commercial Studio \u2022 Standalone Pure JS Zero-Node Build \u2022 Styled SheetJS .XLSX Export'
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>
